name: CI

on: push

env:
  CI: true
  GIT_COMMIT_SHA: ${{ github.sha }}
  GIT_BRANCH: ${{ github.ref }}

jobs:
  linting:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITH: lint
      BUNDLE_WITHOUT: development:test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Rubocop
        run: bundle exec rubocop --format progress

  package:
    needs: [linting]
    runs-on: ubuntu-latest
    env:
      # builds the gem the same way the publish job in release.yml does
      BUNDLE_WITHOUT: development:test:lint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby 4.0
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Build gem
        run: bundle exec rake build

      - name: Install gem
        run: gem install --local pkg/grift-*.gem

      - name: Use installed gem
        run: ruby test/installed_gem_smoke.rb

  build:
    needs: [linting]
    runs-on: ubuntu-latest
    name: build (ruby v${{ matrix.ruby }})
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "2.7"
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Test
        run: bundle exec rake --trace test

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/.resultset.json
          name: codecov-umbrella
          verbose: true
          fail_ci_if_error: true
