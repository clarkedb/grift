name: Approvals

on:
  pull_request:

permissions: {}

jobs:
  approval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Require an approval of the head commit from someone with write access
        if: github.event.pull_request.user.type == 'Bot'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.user.type == "User" and (.state | IN("APPROVED", "CHANGES_REQUESTED", "DISMISSED"))) | [.user.login, .state, .commit_id] | @tsv' |
            awk -F '\t' '{ latest[$1] = $2 "\t" $3 } END { for (login in latest) print login "\t" latest[login] }' > reviews.tsv

          while IFS=$'\t' read -r login state commit; do
            [ "$state" = APPROVED ] && [ "$commit" = "$HEAD_SHA" ] || continue
            permission=$(gh api "repos/$REPO/collaborators/$login/permission" --jq .permission || echo none)
            case "$permission" in
              admin | write)
                echo "Approved by $login"
                exit 0
                ;;
            esac
          done < reviews.tsv

          echo "::error::Pull requests opened by bots need an approval of $HEAD_SHA from someone with write access"
          exit 1
