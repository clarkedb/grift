name: Approvals

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

# runs one at a time per PR so the last status set reflects the latest reviews
concurrency:
  group: approvals-${{ github.event.pull_request.number }}

jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write

    steps:
      - name: Set the approval status on the head commit
        env:
          REQUIRED: ${{ github.event.pull_request.user.type == 'Bot' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=success
          description="Approval not required"

          if [ "$REQUIRED" = true ]; then
            state=failure
            description="Needs your approval of the current commit"

            review=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq '.[] | select(.user.login == "clarkedb" and .state != "COMMENTED") | [.state, .commit_id] | @tsv' \
              | tail -n 1)

            if [ "$review" = "$(printf 'APPROVED\t%s' "$HEAD_SHA")" ]; then
              state=success
              description="Approved by clarkedb"
            fi
          fi

          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context=approval \
            -f description="$description" \
            -f target_url="$RUN_URL" > /dev/null

          echo "$state: $description"
